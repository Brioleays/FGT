
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./assets/css/global.css" />
                
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script> 

        <!-- Tailwind Config -->
        <script>
            tailwind.config = {
            theme: {
                extend: {
                colors: {
                    primary: '',
                    secondary: '',
                    neutralBg: '',
                    neutralText: '',
                    accent: '#000080',
                    
                },
                fontFamily: {
                    customFont: ['open sans', 'sans-serif'],
                    
                },
                borderRadius: {
                    custom: '50px',
                }
                }
            }
            }
        </script>

        <title>FGT | MESAGE</title>
    </head>
    <body class="font-customFont bg-gray-100 h-screen overflow-hidden">

    <!-- HEADER -->
    <div id="sidebarHead"></div>

    <!-- PAGE LAYOUT -->
    <div class="flex h-[calc(100vh-4rem)] relative">

        <!-- SIDEBAR -->
        <div id="sidebarContainer"></div>

        <!-- CONTENT -->
        <main class="flex-1 p-8 pt-0 overflow-y-auto bg-white transition-all duration-300">
            <!-- Page Title -->
            <div class="bg-white rounded-xl shadow-sm border h-full flex overflow-hidden relative">

    <div id="chat-list" class="w-full lg:w-80 border-r flex flex-col bg-white absolute lg:relative z-20 h-full transition-transform duration-300">
        <div class="p-4 border-b">
            <h2 class="font-semibold text-sm mb-3">Conversations</h2>
            <input type="text" placeholder="Search..." class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>

        <div class="flex-1 overflow-y-auto">
            <div class="conversation-item flex items-start gap-3 p-4 hover:bg-gray-50 cursor-pointer border-b">
                <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                <div class="flex-1">
                    <p class="font-medium text-sm">Luis Pittman</p>
                    <p class="text-xs text-gray-500 truncate">Hi, can I ask if there is anything...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-window" class="flex-1 flex flex-col w-full min-w-0">
        <div class="p-4 border-b flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="back-to-list" class="lg:hidden p-2 -ml-2 text-gray-600">←</button>
                <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                <div>
                    <p class="font-medium text-sm">Luis Pittman</p>
                    <span class="text-xs text-green-500">● Online</span>
                </div>
            </div>
        </div>

        <div class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50" id="message-container">
             </div>

        <div class="p-4 border-t flex items-center gap-3 bg-white">
            <input type="text" placeholder="Your message..." class="flex-1 border rounded-full px-4 py-2 text-sm">
            <button class="bg-[#0B1E8A] text-white px-5 py-2 rounded-lg text-sm">Send</button>
        </div>
    </div>
</div>
            
        </main>

    </div>

    <script src="./js/main.js"></script>

</body>
    
 </html>
