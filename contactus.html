
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./assets/css/global.css" />
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script> 

        <!-- Tailwind Config -->
        <script>
            tailwind.config = {
            theme: {
                extend: {
                colors: {
                    primary: '',
                    secondary: '',
                    neutralBg: '',
                    neutralText: '',
                    accent: '#000080',
                    
                },
                fontFamily: {
                    customFont: ['open sans', 'sans-serif'],
                    
                },
                 borderRadius: {
                    'custom': '50px', // Replace '10px' with your desired value
                    },
                }
            }
            }
        </script>

        <title>FGT | CONTACT US</title>
    </head>
    <body class="font-customFont">
        
            <div id="navbar"></div>

            <main class="min-h-screen">
            <!-- Your page content goes here -->
             <section class="relative z-0 py-6 md:py-12  px-6 lg:px-16 rounded-b-custom shadow-lg ">
                    <div class="absolute inset-0 bg-accent/5 rounded-b-custom"></div>
                    <div class="relative z-10">
                        <p class="relative z-10 text-accent text-sm text-center font-semibold  uppercase">
                                contact us
                        </p>

                        <h2 class="text-3xl md:text-6xl font-semibold mt-4 text-center text-gray-900">
                            Let's Get in Touch 
                        </h2>
                        <p class="text-grey-900 text-md text-center mt-4 max-w-2xl mx-auto">
                            The FGTITLE team is here to answer questions, please use the contact form below to reach us. 
                        </p>
                    </div>
                    <form class="mt-12 max-w-2xl mx-auto text-left">
                        <div class="mt-10">
                             <label for="name" class="text-xl ">Full name</label>
                        <input id="name" type="text" class="w-full py-2 px-4 border border-gray-900 my-2 rounded-xl " placeholder="e.g John Doe"/>
                        </div>
                       
                        <div class="my-6">
                            <label for="email" class="text-xl ">Email</label>
                        <input id="email" type="email" class="w-full py-2 px-4 border border-gray-900 my-2 rounded-xl " placeholder="e.g JohnDoe@gmail.com"/>
                        </div>
                        

                        <label for="subject" class="text-xl ">Subject</label>
                        <input id="subject" type="text" class="w-full py-2 px-4 border border-gray-900 my-2 rounded-xl " placeholder="e.g I want to close my property"/>
                        <div class="mt-6">
                            <label for="message" class="text-xl mt-10">Message</label>
                        <textarea id="message" class="h-60 w-full py-2 px-4 border border-gray-900 my-2 rounded-xl " placeholder="e.g Type here"></textarea>
                        </div>
                        
                         <div class="mt-4  max-w-xl mx-auto text-center"><a href="#"><button class="w-full bg-accent text-white px-6 py-3 rounded-full hover:scale-105 transition duration-300">
                                    Submit
                                </button></a></div>
                    </form>
                </section>

            </main>

            <div id="footer"></div>


        
        <script src="./js/main.js"></script>
    </body>
    
 </html>
